# Declarative equivalent of build_agent() in agent.py — with a NAMED
# critique gate instead of agent.py's hand-written one. AgentSpec.critique
# (agent_spec.py) resolves `evaluator: groundedness` into a real
# composite_grounding_kpi, using llm_gateway.make_grounding_judge(llm) as
# the judge, and a default context callable (every tool-result message this
# turn produced) — the same idea as agent.py's own CritiqueConfig, but not
# identical: agent.py's is a cheaper, fully deterministic reference_check_
# kpi (no extra LLM call); the declarative "groundedness" evaluator blends
# that same deterministic check with an LLM judge (composite_grounding_kpi's
# default weighting), since a live custom KPI object still isn't
# JSON/YAML-expressible — a named evaluator is the declarative middle
# ground.
#
# Run (from the repo root, so the dotted tool reference below resolves):
#   export ANTHROPIC_API_KEY=...
#   python -m agent_foundry.cli run --spec examples/autonomous_workflow/agent.yaml \
#       --message "What's the status of order O-500?"
name: order_monitor
instructions: >
  You monitor order status. Call check_order_status, then report the status
  plainly — don't invent details the tool didn't return.
provider: anthropic
tools:
  - examples.autonomous_workflow.agent:check_order_status
policy:
  allowed_tools: [check_order_status]
  max_cost_usd_per_thread: 0.5
  max_steps_per_thread: 10
critique:
  evaluator: groundedness
  threshold: 0.3
  escalate_threshold: 0.1
