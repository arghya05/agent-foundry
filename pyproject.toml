[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundry"
version = "0.1.0"
description = "A vendor-neutral, governed runtime for building and operating enterprise agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6",
    "cryptography>=42.0",
]

# No model vendor is privileged in the base install — "vendor-neutral" holds
# all the way down to what `pip install agent-foundry` actually pulls in.
# Agent()'s zero-config default (LLMGateway(provider=AnthropicProvider()))
# needs `agent-foundry[anthropic]` (or an explicit llm= of your own) — that
# import already fails with a clear ModuleNotFoundError otherwise, same as
# any other lazily-imported optional dependency in this package.
#
# requirements.txt (still includes anthropic) is a SEPARATE, pre-existing
# install path for running this repo's own bundled examples/Dockerfile
# directly — left as-is; it predates pip extras and isn't "the package."
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
mcp = ["mcp>=1.0"]
redis = ["redis>=5.0"]
rag = ["chromadb>=0.5"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sse-starlette>=2.1"]
autogen = ["autogen-agentchat>=0.4", "autogen-ext[openai]>=0.4"]
a2a = ["a2a-sdk>=0.2"]
cedar = ["cedarpy>=1.1"]
otel = ["opentelemetry-sdk>=1.25"]
# Real Draft 2020-12 tool input/output validation (tools_gateway.py's
# _validate_against_schema prefers this when installed, falling back to a
# lightweight required/type checker otherwise) — not test-only.
schema = ["jsonschema>=4.20"]
test = ["pytest>=8.0", "httpx>=0.27", "jsonschema>=4.20"]
all = ["agent-foundry[anthropic,openai,mcp,redis,rag,serve,autogen,a2a,cedar,otel,schema]"]

[project.scripts]
foundry = "agent_foundry.cli:main"

[tool.setuptools.packages.find]
include = ["agent_foundry*"]
