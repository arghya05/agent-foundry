[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundry"
version = "0.1.0"
description = "Python-native runtime and control plane for governed enterprise agents, with pluggable execution engines (native, LangGraph) and model providers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
]

# No model vendor is privileged in the base install — "vendor-neutral" holds
# all the way down to what `pip install agent-foundry` actually pulls in.
# Agent()'s zero-config default (LLMGateway(provider=AnthropicProvider()))
# needs `agent-foundry[anthropic]` (or an explicit llm= of your own) — that
# import already fails with a clear ModuleNotFoundError otherwise, same as
# any other lazily-imported optional dependency in this package.
#
# requirements.txt (still includes anthropic and langgraph) is a SEPARATE,
# pre-existing install path for running this repo's own bundled
# examples/Dockerfile directly — left as-is; it predates pip extras and
# isn't "the package."
[project.optional-dependencies]
# runtime="langgraph" needs this; runtime="native" (Agent's default) doesn't
# — see core/native_engine.py's own module docstring ("this module never
# imports langgraph") and orchestration.py's LangGraph imports, all local to
# the specific build_*_graph/make_act_node/make_critique_node functions that
# actually need them, not module-level. Workflow.supervisor/.swarm/
# .blackboard/.debate/.dag/.fanout each have a native counterpart too
# (core/native_orchestration.py, runtime="native") — this extra is only
# needed for runtime="langgraph" on any of them, or for durable
# checkpointing / a topology-hop approval interrupt either way.
langgraph = ["langgraph>=0.6"]
# quickstart.py's plug_and_play_agent()/to_langchain_tool() — the deliberately
# simple entry point (see README's "Two entry points"), built on real
# langchain.agents.create_agent. `Agent`/`orchestration.py`/`core/agent.py`
# have zero LangChain dependency, direct or transitive — every import here
# is already function-local/lazy, so this extra is a packaging/documentation
# fix, not a code change: nothing eagerly needed langchain before this either.
langchain = ["langchain>=0.3", "langchain-core>=0.3", "langchain-anthropic>=0.3"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
mcp = ["mcp>=1.0"]
redis = ["redis>=5.0"]
rag = ["chromadb>=0.5"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sse-starlette>=2.1"]
autogen = ["autogen-agentchat>=0.4", "autogen-ext[openai]>=0.4"]
a2a = ["a2a-sdk>=0.2"]
cedar = ["cedarpy>=1.1"]
otel = ["opentelemetry-sdk>=1.25"]
# Real Draft 2020-12 tool input/output validation (tools_gateway.py's
# _validate_against_schema prefers this when installed, falling back to a
# lightweight required/type checker otherwise) — not test-only.
schema = ["jsonschema>=4.20"]
# AgentSpec.from_yaml (agent_spec.py) — from_dict/from_json need no extra dep.
spec = ["pyyaml>=6.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "jsonschema>=4.20"]
all = ["agent-foundry[langgraph,langchain,anthropic,openai,mcp,redis,rag,serve,autogen,a2a,cedar,otel,schema,spec]"]

[project.scripts]
foundry = "agent_foundry.cli:main"

[tool.setuptools.packages.find]
include = ["agent_foundry*"]

[tool.ruff.lint]
# Explicit, not relying on ruff's own unconfigured "default" — that default
# has drifted between ruff releases (an unpinned `pip install ruff` in CI
# picking up a newer version started failing this codebase's own deliberate
# patterns, e.g. broad `except Exception` in tool-dispatch resilience code,
# with zero code changes here). E4/E7/E9/F is ruff's own long-documented
# default selection and what this codebase is actually written against;
# pinning it explicitly means a future ruff release adding new default
# categories (bugbear/flake8-blind-except and similar) can't silently break
# CI again the same way.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML has a stub package (types-PyYAML) that's simply not installed here
# — agent_spec.py's from_yaml() already imports it lazily/optionally
# (pip install agent-foundry[spec]); this isn't a "no types exist" gap
# ignore_missing_imports already covers, it's a "stubs exist, aren't
# installed" one mypy reports separately.
module = "yaml"
ignore_missing_imports = true
