name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: an unpinned `pip install ruff` previously picked up whatever
      # ruff released that week, which silently started failing this exact
      # job with zero code changes here once ruff's own rule set moved.
      # Config now also lives explicitly in pyproject.toml's
      # [tool.ruff.lint] (select = E4/E7/E9/F, not an unpinned "default") —
      # ruff needs no package install of agent-foundry itself, it's a pure
      # AST/syntax check.
      - run: pip install ruff==0.12.7
      - run: ruff check agent_foundry/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Real packages installed (not just `pip install mypy`) so mypy
      # cross-checks against actual third-party stubs/types where they
      # exist, not just the pyproject.toml [tool.mypy] ignore_missing_imports
      # fallback — same install shape as the pytest job below, so a local
      # `mypy agent_foundry/` (with [all] installed) matches CI exactly.
      # mypy itself pinned for the same reason ruff is above — an unpinned
      # mypy (or a newer third-party stub release pulled in via [all])
      # previously failed this job on type mismatches unrelated to any
      # change in this repo.
      - run: pip install -e ".[all,test]" mypy==1.11.2
      - run: mypy agent_foundry/

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # `all` pulls in every optional integration (openai/mcp/redis/rag/serve/
      # autogen/a2a/cedar/otel/schema) so the suite exercises as much real
      # code as this runner can support — anything still unavailable here
      # (a live opa/vault binary, a reachable redis-server, npx) is already
      # designed to skip cleanly (pytest.importorskip / skipif), not fail.
      - name: Install agent-foundry with all extras
        run: pip install -e ".[all,test]"

      # 80 is a real margin below the ~84% this suite currently holds, not a
      # threshold tuned to just barely pass — catches an actual coverage
      # regression without flaking on ordinary day-to-day drift.
      - name: Run test suite with coverage
        run: pytest -q --cov=agent_foundry --cov-report=term-missing --cov-fail-under=80
