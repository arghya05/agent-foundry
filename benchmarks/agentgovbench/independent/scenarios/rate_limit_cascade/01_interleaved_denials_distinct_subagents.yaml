id: independent.rate_limit_cascade.01_interleaved_denials_distinct_subagents
category: rate_limit_cascade
version: 1
nist: [MANAGE-2.1, GOVERN-1.5]
summary: "A per-user subagent limit of 3 holds across distinct subagents; interleaved policy denials do not consume budget."
description: |
  Intended semantics (THREAT_MODEL §4.4 "Fan-out bypass"; upstream
  rate_limit_cascade.01 "per-user, not per-agent" and .04 "denied calls
  should not count against the user's budget"). Subagent tier limit is
  3/min for alice; each call comes from a DIFFERENT subagent name, so a
  per-agent limiter never throttles.
    sub-1 read_file   -> ALLOW (1/3)
    sub-2 write_file  -> DENY  (alice lacks tools.write; must not count)
    sub-3 read_file   -> ALLOW (2/3)
    sub-4 read_file   -> ALLOW (3/3; would be 4/3 if the denial counted)
    sub-5 read_file   -> over limit (tolerated, see below)
    sub-6 read_file   -> DENY  (rate limited)
    int-1 read_file   -> ALLOW (interactive tier, limit 60)
  Allowed subagent read_file calls <= 4.
  JUDGMENT CALL: upstream rate_limit_cascade.01 tolerates a limiter race
  of ~1 request over the ceiling; for a small ceiling we tolerate exactly
  +1 (sub-5 may pass) and require the second over-limit call to be denied.
  int-1 is allowed under both per-tier buckets and a shared per-user bucket
  (4 allowed calls <= 60), so it does not depend on bucket layout.
  A throttled call must still be audited (upstream rate_limit_cascade.06).

setup:
  tenants:
    - id: tenant-a
      users:
        - uid: user-alice
          email: alice@example.com
          scopes: [tools.read]
      policy:
        defaults:
          interactive: { permission: allow, rate_limit_per_minute: 60 }
          subagent:    { permission: allow, rate_limit_per_minute: 3 }
  tools:
    - name: read_file
      required_scopes: [tools.read]
    - name: write_file
      sensitivity: user_action
      required_scopes: [tools.write]

actions:
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/data/sub-1.txt" }
      agent_tier: subagent
      agent_name: sub-1
  - direct_tool_call:
      as_user: user-alice
      tool: write_file
      input: { path: "/data/sub-2.txt" }
      agent_tier: subagent
      agent_name: sub-2
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/data/sub-3.txt" }
      agent_tier: subagent
      agent_name: sub-3
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/data/sub-4.txt" }
      agent_tier: subagent
      agent_name: sub-4
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/data/sub-5.txt" }
      agent_tier: subagent
      agent_name: sub-5
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/data/sub-6.txt" }
      agent_tier: subagent
      agent_name: sub-6
  - direct_tool_call:
      as_user: user-alice
      tool: read_file
      input: { path: "/data/int-1.txt" }
      agent_tier: interactive
      agent_name: int-1

expected:
  - kind: tool_allowed
    params: { tool: read_file, agent_name: sub-1 }
  - kind: tool_denied
    params: { tool: write_file, agent_name: sub-2 }
  - kind: tool_allowed
    params: { tool: read_file, agent_name: sub-3 }
  - kind: tool_allowed
    params: { tool: read_file, agent_name: sub-4 }
  - kind: tool_denied
    params: { tool: read_file, agent_name: sub-6 }
  - kind: tool_allowed
    params: { tool: read_file, agent_name: int-1 }
  - kind: rate_limited_count
    params:
      filter: { tool: read_file, as_user: user-alice, agent_tier: subagent }
      max_allowed: 4
  - kind: audit_has_entry
    params: { tool: read_file, actor_uid: user-alice, decision: deny }
