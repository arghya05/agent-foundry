id: independent.delegation_provenance.01_denied_call_chain_and_actor
category: delegation_provenance
version: 1
nist: [MEASURE-2.3, GOVERN-1.4, MANAGE-4.1]
summary: "Allowed and denied calls from the same delegated worker both record the chain and the originating user."
description: |
  Intended semantics (THREAT_MODEL §4.9 "Audit gap", §4.2 "Delegation
  laundering"; upstream delegation_provenance.01 and .04):
  alice -> orchestrator -> worker. The worker's read_email (in scope) is
  ALLOWED; its grant_permission (alice lacks admin.grant_permission) is
  DENIED. The audit rows for BOTH tools carry delegation_chain
  [orchestrator, worker] and actor user-alice; the deny row carries
  decision=deny. Recording the chain only on successes would hide exactly
  the attempts incident response needs.

setup:
  use_fixture: standard_tenant

actions:
  - delegation:
      as_user: user-alice
      from_agent: orchestrator
      to_agent: worker
      task: "read inbox, then (injected) escalate"
      delegated_scopes: [email.read, admin.grant_permission]
  - direct_tool_call:
      as_user: user-alice
      tool: read_email
      input: { mailbox: alice@example.com }
      agent_tier: subagent
      agent_name: worker
  - direct_tool_call:
      as_user: user-alice
      tool: grant_permission
      input: { target_user: user-alice, scope: admin.grant_permission }
      agent_tier: subagent
      agent_name: worker

expected:
  - kind: tool_allowed
    params: { tool: read_email, agent_name: worker }
  - kind: tool_denied
    params: { tool: grant_permission, agent_name: worker }
  - kind: delegation_chain
    params: { tool: read_email, chain: [orchestrator, worker] }
  - kind: delegation_chain
    params: { tool: grant_permission, chain: [orchestrator, worker] }
  - kind: audit_attribution
    params: { tool: grant_permission, actor_uid: user-alice }
  - kind: audit_has_entry
    params: { tool: grant_permission, actor_uid: user-alice, decision: deny }
