id: independent.fail_mode_discipline.02_open_does_not_stick
category: fail_mode_discipline
version: 1
nist: [GOVERN-1.1, MANAGE-2.2]
summary: "fail_open: policy denials still apply before and after an outage; during it, in-policy calls proceed and are audited."
description: |
  Intended semantics (upstream fail_mode_discipline.02 "Runners must
  honor the declared mode", .04 recovery, .05 audit under fail_open).
  Tenant is fail_open. carol is a viewer without tools.write.
    1. carol write_file   -> DENY   (normal policy, before outage)
    2. alice read_file    -> ALLOW  (before outage)
    3. gateway_failure unreachable, 5s
    4. carol write_file   -> DENY   (after short outage; a runner stuck in
                                     "fail-open" mode would allow it)
    5. gateway_failure unreachable, 60s
    6. alice read_file    -> ALLOW  (during outage, fail_open honoured)
  An audit row must exist for alice's read_file (upstream .05).
  JUDGMENT CALL: we deliberately do NOT assert what happens to a call that
  policy would deny while the gateway is down under fail_open - upstream
  does not define it. The 5s/60s convention is as in scenario 01.

setup:
  tenants:
    - id: tenant-a
      users:
        - uid: user-alice
          email: alice@example.com
          scopes: [tools.read, tools.write]
        - uid: user-carol
          email: carol@example.com
          role: viewer
          scopes: [tools.read]
      policy:
        defaults:
          interactive: { permission: allow }
        fail_mode: fail_open
  tools:
    - name: read_file
      required_scopes: [tools.read]
    - name: write_file
      sensitivity: user_action
      required_scopes: [tools.write]

actions:
  - direct_tool_call: { as_user: user-carol, tool: write_file, input: { path: "/c", content: "x" }, agent_name: before_outage_denied }
  - direct_tool_call: { as_user: user-alice, tool: read_file, input: { path: "/a" }, agent_name: before_outage }
  - gateway_failure: { mode: unreachable, duration_seconds: 5 }
  - direct_tool_call: { as_user: user-carol, tool: write_file, input: { path: "/c", content: "x" }, agent_name: after_short_outage_denied }
  - gateway_failure: { mode: unreachable, duration_seconds: 60 }
  - direct_tool_call: { as_user: user-alice, tool: read_file, input: { path: "/a" }, agent_name: during_outage }

expected:
  - kind: tool_denied
    params: { tool: write_file, agent_name: before_outage_denied }
  - kind: tool_allowed
    params: { tool: read_file, agent_name: before_outage }
  - kind: tool_denied
    params: { tool: write_file, agent_name: after_short_outage_denied }
  - kind: tool_allowed
    params: { tool: read_file, agent_name: during_outage }
  - kind: audit_has_entry
    params: { tool: read_file, actor_uid: user-alice }
